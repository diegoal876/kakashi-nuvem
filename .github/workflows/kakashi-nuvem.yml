name: Kakashi Nuvem (Postagem + Radar 24h)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Rodar mesmo com o PC ligado (teste)'
        required: false
        default: '0'

permissions:
  actions: write
  contents: read

concurrency:
  group: kakashi-nuvem
  cancel-in-progress: false

jobs:
  postar-e-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Sao_Paulo
      POSTAGEM_DIR: ${{ github.workspace }}/output/postagem
      POSTAGEM_DRIVE: ${{ github.workspace }}/drive_postagens
      AVATAR_DRIVE_DIR: ${{ github.workspace }}/drive_avatares
      FORCAR_NUVEM: ${{ github.event.inputs.forcar || '0' }}

    steps:
      - name: Checkout codigo do Kakashi
        uses: actions/checkout@v4

      - name: Configurar rclone (Google Drive)
        env:
          RCLONE_CONF_SECRET: ${{ secrets.RCLONE_CONF }}
        run: |
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
            unzip -q /tmp/rclone.zip -d /tmp/rclone_bin
            sudo cp /tmp/rclone_bin/*/rclone /usr/local/bin/rclone
            sudo chmod +x /usr/local/bin/rclone
          fi
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONF_SECRET" > ~/.config/rclone/rclone.conf
          mkdir -p "$POSTAGEM_DIR/videos" "$POSTAGEM_DRIVE" "$AVATAR_DRIVE_DIR"

      - name: Checar se o PC esta acordado (Heartbeat)
        id: check_pc
        run: |
          rclone copyto "gdrive:Non Shop/001/_kakashi_nuvem/heartbeat_pc.json" "$POSTAGEM_DIR/heartbeat_pc.json" || true
          python3 - << 'EOF'
          import json, os, time
          from pathlib import Path
          hb_path = Path(os.environ["POSTAGEM_DIR"]) / "heartbeat_pc.json"
          forcar = os.environ.get("FORCAR_NUVEM") == "1"
          ativo = False
          if hb_path.is_file() and not forcar:
              try:
                  hb = json.loads(hb_path.read_text(encoding="utf-8"))
                  delta = int(time.time()) - int(hb.get("em") or 0)
                  if 0 <= delta < 300:
                      print(f"PC acordado ha {delta}s ({hb.get('hora')}). Nuvem em standby.")
                      ativo = True
              except Exception:
                  pass
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pc_ativo={'true' if ativo else 'false'}\n")
          EOF

      - name: Baixar fila, tokens e videos pendentes do Google Drive
        if: steps.check_pc.outputs.pc_ativo != 'true'
        run: |
          for t in 1 2 3; do
            rclone copy "gdrive:Non Shop/001/_kakashi_nuvem" "$POSTAGEM_DIR" --exclude "*.tmp" && break
            echo "rclone copy falhou (tentativa $t), tentando de novo..."; sleep 15
          done
          test -f "$POSTAGEM_DIR/fila.json"
          python3 - << 'EOF'
          import json, os, subprocess
          from pathlib import Path
          pdir = Path(os.environ["POSTAGEM_DIR"])
          ddir = Path(os.environ["POSTAGEM_DRIVE"])
          fila = json.loads((pdir / "fila.json").read_text(encoding="utf-8")) if (pdir / "fila.json").is_file() else {}
          vistos = set((fila.get("drive_vistos") or {}).keys())
          # 11/11/2026: a 60 s listing timeout failed the whole run; now 3 tries of up to 180 s, and a failed
          # listing never stops the posting (new Drive files wait for the next run)
          r = None
          for tent in range(3):
              try:
                  r = subprocess.run(["rclone", "lsjson", "-R", "--files-only", "--max-age", "48h", "gdrive:Non Shop/001/Postagens"],
                                     capture_output=True, text=True, timeout=180)
                  if r.returncode == 0:
                      break
              except subprocess.TimeoutExpired:
                  print(f"Listagem do Drive demorou demais (tentativa {tent + 1}/3)")
              r = None
          if r is None:
              print("Sem listagem do Drive nesta execucao: arquivos novos ficam para a proxima.")
          else:
              for item in json.loads(r.stdout or "[]"):
                  rel = item.get("Path", "")
                  if rel and rel not in vistos and rel.lower().endswith((".mp4", ".mov", ".m4v", ".webm", ".txt")):
                      print(f"Baixando arquivo novo do Drive: {rel}")
                      try:
                          subprocess.run(["rclone", "copyto", f"gdrive:Non Shop/001/Postagens/{rel}", str(ddir / rel)], timeout=120)
                      except subprocess.TimeoutExpired:
                          print(f"Download demorou demais, fica para a proxima: {rel}")
          EOF

      - name: Executar Postador + Roleta
        id: postar
        if: steps.check_pc.outputs.pc_ativo != 'true'
        run: |
          python3 tools/clone/rodar_nuvem.py --sem-radar

      - name: Devolver fila e Radar atualizados para o Google Drive
        if: always() && steps.check_pc.outputs.pc_ativo != 'true' && steps.postar.outcome != 'skipped'
        run: |
          for arq in fila.json contas.json roleta.json radar.json nuvem_status.json; do
            if [ -f "$POSTAGEM_DIR/$arq" ]; then
              rclone copyto "$POSTAGEM_DIR/$arq" "gdrive:Non Shop/001/_kakashi_nuvem/$arq"
            fi
          done

      - name: Auto-encadear proxima execucao se ainda restarem videos na fila
        if: steps.check_pc.outputs.pc_ativo != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, os, subprocess, sys, time
          sys.path.insert(0, "tools/clone")
          import postagem
          agora = time.time()
          hb_path = postagem.DIR / "heartbeat_pc.json"
          if hb_path.is_file():
              try:
                  hb = json.loads(hb_path.read_text(encoding="utf-8"))
                  if 0 <= int(agora) - int(hb.get("em") or 0) < 300:
                      raise SystemExit(0)
              except Exception:
                  pass
          restam = any(
              i.get("status") == "agendado" and (
                  postagem._devidos(i, agora + 3600)
                  or (i.get("quando") and i["quando"] <= agora + 2 * 3600 and postagem._restantes(i))
              )
              for i in postagem.fila.get("itens", [])
          )
          if restam:
              print("Ainda ha videos devidos ou proximos na fila; disparando proxima execucao automatica...")
              subprocess.run(["gh", "workflow", "run", "kakashi-nuvem.yml", "-f", "forcar=0"], check=False)
          EOF

      - name: Radar de Virais (Discord), depois da fila devolvida
        if: always() && steps.check_pc.outputs.pc_ativo != 'true' && steps.postar.outcome == 'success'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          python3 tools/clone/rodar_nuvem.py --radar
